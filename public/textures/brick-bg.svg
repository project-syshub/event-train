<svg xmlns="http://www.w3.org/2000/svg" width="100" height="50" viewBox="0 0 100 50">
  <rect width="100" height="50" fill="#8a6245" />
  <!-- 1段目 -->
  <rect x="1" y="1" width="46" height="21" fill="#c17f4a" stroke="#8a6245" stroke-width="1.5" />
  <rect x="51" y="1" width="46" height="21" fill="#b8734a" stroke="#8a6245" stroke-width="1.5" />
  <!-- 2段目（半分ずらして互い違いに積む） -->
  <rect x="-22" y="26" width="45" height="21" fill="#b8734a" stroke="#8a6245" stroke-width="1.5" />
  <rect x="26" y="26" width="46" height="21" fill="#c17f4a" stroke="#8a6245" stroke-width="1.5" />
  <rect x="75" y="26" width="45" height="21" fill="#b8734a" stroke="#8a6245" stroke-width="1.5" />
  <!-- 明るいハイライトのレンガ -->
  <rect x="1" y="1" width="46" height="21" fill="#d4a574" opacity="0.35" />
  <rect x="26" y="26" width="46" height="21" fill="#d4a574" opacity="0.25" />
  <!-- アクセントの赤みが強いレンガ -->
  <rect x="51" y="1" width="46" height="21" fill="#a8492f" opacity="0.3" />
  <!-- 質感のための汚れ・かすれ -->
  <circle cx="20" cy="11" r="1" fill="#5a3e26" opacity="0.25" />
  <circle cx="70" cy="36" r="1.2" fill="#5a3e26" opacity="0.25" />
  <circle cx="40" cy="36" r="0.8" fill="#5a3e26" opacity="0.2" />
  <circle cx="85" cy="10" r="0.9" fill="#5a3e26" opacity="0.2" />
  <circle cx="10" cy="33" r="0.7" fill="#5a3e26" opacity="0.18" />
</svg>

# 【役割】main にプッシュしたら、さくらのVPSに自動で反映する（VPS で deploy/update.sh を実行する）。
#
# 【必要な設定】GitHub のリポジトリの Settings → Secrets and variables → Actions に登録する
#   Secrets:   VPS_HOST（VPSのIPアドレスかドメイン）/ VPS_USER（ubuntu）/ VPS_SSH_KEY（自動デプロイ用の秘密鍵）
#   Variables: AUTO_DEPLOY … off にすると自動デプロイを止める（イベント当日など）。未設定なら動く
# Secrets が未登録のあいだは、何もせずに終わる（失敗にはならない）。
#
# 【手動で反映したいとき】GitHub の Actions タブ → Deploy to Sakura VPS → Run workflow

name: Deploy to Sakura VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# 続けてプッシュしたときに、反映が同時に走らないようにする（後のものは前のものの完了を待つ）
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AUTO_DEPLOY != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Secrets が未登録なら何もしない
        if: env.VPS_HOST == '' || env.VPS_USER == '' || env.VPS_SSH_KEY == ''
        run: echo "VPS_HOST / VPS_USER / VPS_SSH_KEY が未登録なので、VPS への反映はしません"

      - name: VPS で deploy/update.sh を実行する
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'cd ~/event-train && bash deploy/update.sh'
